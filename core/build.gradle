plugins {
    id 'com.android.library'
}

android {
    namespace 'org.telegram.lab'
    compileSdk 36
    defaultConfig {
        minSdk 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Renders Telegram's Lottie tab icons (Telegram itself uses rlottie).
    api 'com.airbnb.android:lottie:6.5.2'
}
