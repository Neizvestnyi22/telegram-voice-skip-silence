plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
}

// Every feature is its own app module that applies this block.
ext.featureApp = { Project p, String id ->
    p.apply plugin: 'com.android.application'
    p.android {
        namespace "org.telegram.lab.${id}"
        compileSdk 36
        defaultConfig {
            applicationId "org.telegram.lab.${id}"
            minSdk 26
            targetSdk 36
            versionCode 1
            versionName '1.0'
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
    p.dependencies {
        implementation project(':core')
    }
}
